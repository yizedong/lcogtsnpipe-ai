name: Reduce a target
description: Ask for a light curve of an object (no code change)
labels: [reduction, triage]
body:
  - type: input
    attributes: {label: Target name, placeholder: "2025rbs"}
    validations: {required: true}
  - type: input
    attributes: {label: Coordinates (deg), placeholder: "339.265262 +34.418892"}
  - type: input
    attributes: {label: Date range, placeholder: "2025-07-15 to 2026-09-17"}
    validations: {required: true}
  - type: input
    attributes: {label: Filters and telescopes, placeholder: "U B V g r i; 1m0 0m4"}
  - type: input
    attributes: {label: Templates, placeholder: "1m0 frames of night 2026-09-18, or 'auto'"}
  - type: textarea
    attributes: {label: Notes, description: "Comparison data, deadlines, anything special"}
