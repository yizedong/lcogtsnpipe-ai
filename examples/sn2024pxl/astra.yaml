version: 0.0.14
id: sn2024pxl_lco_photometry
name: 2024pxl LCO photometry (snpipe)
description: 'IRAF-free reduction of LCO BANZAI frames of 2024pxl with snpipe (lcogtsnpipe-ai): ingest, catalogs,
  cosmic rays, PSF, PSF/aperture photometry, zero points, PyZOGY difference imaging and calibration, with per-stage
  QA gates and review packets.'
tags:
- photometry
- lco
- supernova
- difference-imaging
inputs:
- id: raw_frames
  type: data
  source: rawdata/2024pxl_sel
  description: BANZAI e91 frames (+ frames.json from the archive query)
- id: template_frames
  type: data
  source: rawdata/templates_2017drh
  description: Pre-explosion reference frames (+ frames.json)
outputs:
- id: target_registered
  type: metric
  format: json
  description: Target in the pipeline database (SNEx-equivalent coordinates)
  inputs:
  - raw_frames
  recipe:
    command: snpipe add-target 2024pxl --ra 263.113958 --dec 7.062411 --alias SN2024pxl > {output}
- id: ingest_qa
  type: metric
  format: json
  description: Science frames placed and registered (funpack-equivalent unpacking)
  inputs:
  - raw_frames
  - target_registered
  recipe:
    command: snpipe ingest --target 2024pxl --frames-json {inputs.raw_frames}/frames.json --local-dir {inputs.raw_frames}
      > {output}
- id: template_ingest_qa
  type: metric
  format: json
  description: Pre-explosion reference frames placed and registered
  inputs:
  - template_frames
  - target_registered
  recipe:
    command: snpipe ingest --target 2024pxl --frames-json {inputs.template_frames}/frames.json --local-dir {inputs.template_frames}
      > {output}
- id: catalogs
  type: metric
  format: json
  description: APASS / SDSS (or PS1) / Gaia field catalogs, old cuts and formats
  inputs:
  - target_registered
  decisions:
  - sloan_source
  recipe:
    command: snpipe catalogs --target 2024pxl --sloan-source {decisions.sloan_source} > {output}
- id: cosmic_qa
  type: metric
  format: json
  description: L.A.Cosmic (astroscrappy, sigclip 4.5, sigfrac 0.2, objlim 4) per frame
  inputs:
  - ingest_qa
  recipe:
    command: snpipe cosmic -n 2024pxl -e 20240722-20241110 -j 8 && cp qa/cosmic-latest.json {output}
- id: template_cosmic_qa
  type: metric
  format: json
  description: L.A.Cosmic (astroscrappy, sigclip 4.5, sigfrac 0.2, objlim 4) per frame
  inputs:
  - template_ingest_qa
  recipe:
    command: snpipe cosmic -n 2024pxl -e 20180306 -j 8 && cp qa/cosmic-latest.json {output}
- id: psf_qa
  type: metric
  format: json
  description: PSF model, aperture correction (gate |apco|<=max) and sn2 table per frame
  inputs:
  - cosmic_qa
  - catalogs
  decisions:
  - psf_model
  - psf_auto_fix
  - max_apercorr
  - psf_nstars
  recipe:
    command: snpipe psf -n 2024pxl -e 20240722-20241110 -j 8 --model {decisions.psf_model} --auto-fix {decisions.psf_auto_fix}
      --max-apercorr {decisions.max_apercorr} --nstars {decisions.psf_nstars} && cp qa/psf-latest.json {output}
- id: psfmag_qa
  type: metric
  format: json
  description: Target PSF + aperture photometry on unsubtracted frames
  inputs:
  - psf_qa
  recipe:
    command: snpipe psfmag -n 2024pxl -e 20240722-20241110 -j 8 && cp qa/psfmag-latest.json {output}
- id: zcat_qa
  type: metric
  format: json
  description: Zero points and colour terms (fixed colour terms, 2-sigma clipping)
  inputs:
  - psf_qa
  decisions:
  - bv_catalog
  - gri_catalog
  recipe:
    command: snpipe zcat -n 2024pxl -e 20240722-20241110 -f landolt --field {decisions.bv_catalog} && snpipe zcat
      -n 2024pxl -e 20240722-20241110 -f sloan --field {decisions.gri_catalog} && cp qa/zcat-latest.json {output}
- id: mag_qa
  type: metric
  format: json
  description: Calibrated target magnitudes (unsubtracted, PSF)
  inputs:
  - psfmag_qa
  - zcat_qa
  recipe:
    command: snpipe mag -n 2024pxl -e 20240722-20241110 --type fit && cp qa/mag-latest.json {output}
- id: template_qa
  type: metric
  format: json
  description: Reference frames marked (filetype 4), cleaned and PSF-modelled
  inputs:
  - template_cosmic_qa
  - catalogs
  decisions:
  - psf_model
  - psf_auto_fix
  - max_apercorr
  - psf_nstars
  recipe:
    command: snpipe template -n 2024pxl -e 20180306 && snpipe cosmic -n 2024pxl -e 20180306 --filetype 4 -j 8 &&
      snpipe psf -n 2024pxl -e 20180306 --filetype 4 -j 8 --model {decisions.psf_model} --auto-fix {decisions.psf_auto_fix}
      --max-apercorr {decisions.max_apercorr} --nstars {decisions.psf_nstars} && cp qa/psf-latest.json {output}
- id: diff_qa
  type: metric
  format: json
  description: PyZOGY difference images (template = earliest reference per filter)
  inputs:
  - psf_qa
  - template_qa
  decisions:
  - template_camera
  - diff_normalize
  - diff_register
  - diff_region
  recipe:
    command: snpipe diff -n 2024pxl -e 20240722-20241110 -j 4 --tempdate 20180306 --temptel {decisions.template_camera}
      --normalize {decisions.diff_normalize} --register {decisions.diff_register} --region {decisions.diff_region}
      && cp qa/diff-latest.json {output}
- id: diff_phot_qa
  type: metric
  format: json
  description: PSF of the difference images, target photometry on them
  inputs:
  - diff_qa
  recipe:
    command: snpipe psf -n 2024pxl -e 20240722-20241110 --filetype 3 -j 8 && snpipe psfmag -n 2024pxl -e 20240722-20241110
      --filetype 3 -j 8 && cp qa/psfmag-latest.json {output}
- id: diff_zcat_qa
  type: metric
  format: json
  description: Zero points of the difference images (from the reference sn2)
  inputs:
  - diff_phot_qa
  decisions:
  - bv_catalog
  - gri_catalog
  - diff_phot_type
  recipe:
    command: snpipe zcat -n 2024pxl -e 20240722-20241110 --filetype 3 -f landolt --field {decisions.bv_catalog}
      && snpipe zcat -n 2024pxl -e 20240722-20241110 --filetype 3 -f sloan --field {decisions.gri_catalog} --type
      {decisions.diff_phot_type} && cp qa/zcat-latest.json {output}
- id: light_curve
  type: table
  format: csv
  description: Template-subtracted calibrated light curve (dateobs, jd, mag, dmag, telescope, filter, magtype)
  inputs:
  - diff_zcat_qa
  decisions:
  - diff_phot_type
  recipe:
    command: snpipe mag -n 2024pxl -e 20240722-20241110 --filetype 3 --type {decisions.diff_phot_type} && snpipe
      getmag -n 2024pxl -e 20240722-20241110 --filetype 3 --type mag -o {output}
- id: review_queue
  type: report
  format: json
  description: 'Frames for agent/human review: all warn/fail + a random ok sample, with PNG packets (replaces the
    interactive check* stages)'
  inputs:
  - psf_qa
  - psfmag_qa
  - diff_qa
  recipe:
    command: snpipe review psf --ensemble apco fwhm_psf_x_pix && snpipe review psfmag && snpipe review diff && cat
      review/*/queue.json > {output}
decisions:
  sloan_source:
    label: Catalog for the SDSS-filter calibration
    rationale: Changes every gri zero point; the old pipeline uses SDSS unless the field is not covered.
    default: sdss
    options:
      sdss:
        label: SDSS DR PhotoPrimary (comparecatalogs default)
      panstarrs:
        label: Pan-STARRS1 DR1 (comparecatalogs -p)
  bv_catalog:
    label: Catalog for B,V zero points
    default: apass
    rationale: B and V cannot be calibrated to SDSS; APASS is the field catalog the manual uses.
    options:
      apass:
        label: APASS DR9
      landolt:
        label: Local Landolt sequence (needs standards)
  gri_catalog:
    label: Catalog for g,r,i zero points
    default: sloan
    rationale: Singh et al. calibrate gri to SDSS.
    options:
      sloan:
        label: SDSS (or PS1 file)
      apass:
        label: APASS
  psf_model:
    label: PSF model
    default: daophot
    rationale: The PSF shape enters every PSF magnitude and the aperture correction.
    options:
      daophot:
        label: Pixel-integrated Gaussian + 2x residual lookup table (DAOPHOT recipe)
      epsf:
        label: photutils EPSFBuilder empirical PSF
  psf_auto_fix:
    label: Remediation ladder for failed PSFs
    default: ladder
    rationale: The manual tells the user to retry a failed PSF with larger FWHM, lower datamax, more stars or another
      catalog; without it those frames are lost.
    options:
      ladder:
        label: Apply the manual's fixes automatically
      'off':
        label: Single attempt, as an unattended old run
  psf_nstars:
    label: Number of PSF stars
    default: n6
    rationale: Old default 6 (lscpsf -p 6). With a constant PSF over the frame, 6 stars leave a 0.02-0.04 mag bias
      and 0.07-0.10 mag scatter of PSF vs aperture mags on 1-m frames (both pipelines); the manual suggests 12 as
      a remedy.
    options:
      n6:
        label: 6 (old default)
      n12:
        label: '12'
      n20:
        label: '20'
  max_apercorr:
    label: Aperture-correction gate (mag)
    default: apco_0p1
    rationale: Old pipeline default --max_apercorr 0.1.
    options:
      apco_0p1:
        label: 0.1 mag
      apco_0p2:
        label: 0.2 mag (looser)
  template_camera:
    label: Camera of the reference frames
    default: fl
    rationale: The 2018-03-07 references were taken with the 1-m Sinistro fl05.
    options:
      fl:
        label: 1-m Sinistro (fl)
  diff_normalize:
    label: Photometric normalisation of the difference
    default: t
    rationale: 'lscloop default --normalize t: differences in reference units, calibrated with the reference field
      stars.'
    options:
      t:
        label: reference (template)
      i:
        label: science image
  diff_register:
    label: Resampling of the reference onto the science grid
    default: adaptive
    rationale: The old default was IRAF gregister drizzle (flux conserving); the manual warns the --no_iraf bilinear
      path may be worse.
    options:
      adaptive:
        label: reproject_adaptive, flux conserving (closest to drizzle)
      exact:
        label: reproject_exact (area overlap) x pixel-area ratio; slow
      bilinear:
        label: reproject_interp bilinear x pixel-area ratio
  diff_region:
    label: Area of the frame that is subtracted
    default: full
    rationale: 'The old pipeline subtracts the full frame (PyZOGY: ~6.9 GB and ~3 min per 4k frame). A 2048x2048
      cutout around the target is ~4x cheaper; the gain fit then uses only the stars of that region.'
    options:
      full:
        label: full frame (old pipeline)
      cutout:
        label: 2048x2048 px around the target
  diff_phot_type:
    label: Photometry on difference images
    default: ph
    rationale: lscloop uses aperture photometry for difference images by default (the PyZOGY PSF is neither the
      science nor the reference PSF).
    options:
      ph:
        label: aperture (3 FWHM)
      fit:
        label: PSF fit
